<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listado de Películas</title>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <div id="app">

    <header>
      <h1>🎬 Películas</h1>
      <button @click="toggleFiltro">
        {{ soloEnCines ? 'Mostrar todas' : 'En cines' }}
      </button>
    </header>

    <p v-if="peliculasFiltradas.length === 0" class="sin-resultados">
      No hay películas en cines actualmente.
    </p>

    <ul class="lista">
      <li v-for="pelicula in peliculasFiltradas" :key="pelicula.titulo" class="pelicula">
        <img :src="pelicula.imagen" :alt="pelicula.titulo" />
        <div class="info">
          <h2>{{ pelicula.titulo }} <span class="anio">({{ pelicula.anio }})</span></h2>
          <p class="descripcion">{{ pelicula.descripcion }}</p>
          <p class="valoracion">
            <strong>Valoración:</strong> {{ pelicula.valoracion }}/10
          </p>
          <span v-if="pelicula.enCines" class="badge">En cines</span>
        </div>
      </li>
    </ul>

  </div>

  <script src="js/app.js"></script>

</body>
</html>
