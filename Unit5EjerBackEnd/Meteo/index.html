<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estacions Meteorològiques – Meteocat</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 class="logo">&#9928; Estacions Meteorològiques de Catalunya</h1>
      <p class="subtitle">Xarxa d'Estacions Meteorològiques Automàtiques (XEMA) – Meteocat</p>
    </div>
  </header>

  <main>

    <!-- Cerca amb autocomplete -->
    <section class="search-station">
      <div class="search-input-row">
        <div class="search-input-wrapper">
          <input
            type="text"
            id="search-input"
            placeholder="Nom o codi d'estació..."
            autocomplete="off"
          />
        </div>
        <button id="btn-search" class="btn-search" title="Cercar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
      <!-- Dropdown autocomplete -->
      <ul id="autocomplete-list" class="autocomplete-list hidden"></ul>
    </section>

    <!-- Botons principals -->
    <div class="controls">
      <button id="btn-load" class="btn btn-primary">&#8681; Carregar estacions</button>
      <button id="btn-clear" class="btn btn-secondary" disabled>&#10005; Netejar</button>
    </div>

    <div id="loading" class="loading hidden">Carregant estacions...</div>
    <div id="error-msg" class="error-msg hidden"></div>

    <div id="results-section" class="hidden">
      <p id="counter" class="counter"></p>
      <div id="stations-container" class="stations-grid"></div>

      <!-- Sliderbar SOTA el grid -->
      <div id="slider-section" class="slider-wrapper hidden">
        <span class="slider-label-left">1</span>
        <input type="range" id="page-slider" min="0" max="0" step="10" value="0" />
        <span id="slider-label-right" class="slider-label-right"></span>
      </div>
    </div>

  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
